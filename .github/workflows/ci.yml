name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  test:
    name: Build, test, lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Format check
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --all-targets --all-features

      - name: Build
        run: cargo build --workspace --all-targets --all-features --verbose

      # Run the full behavior suite with every feature enabled, in normal PR CI
      # (not deferred to the release workflow), so feature-specific regressions
      # are caught before merge.
      - name: Test (all features)
        run: cargo test --workspace --all-features --verbose

      # Experimental surfaces sit behind `experimental-*` features
      # (docs/feature-stages.md). The steps above build with every feature on,
      # and a workspace-wide build unifies features through the examples
      # crate, so check the gated crates on their own with their features
      # off, doctests included.
      - name: Feature-stage rules
        run: cargo xtask features check

      - name: Gated crates without experimental features
        run: |
          cargo check --all-targets -p agent-framework-core -p agent-framework-cosmos -p agent-framework-azure-ai-search -p agent-framework-declarative
          cargo test --doc -p agent-framework-core -p agent-framework-cosmos -p agent-framework-azure-ai-search -p agent-framework-declarative

  msrv:
    name: MSRV (Rust 1.88)
    runs-on: ubuntu-latest
    # `-D warnings` is a lint gate for stable; the MSRV job only needs to prove
    # the workspace still *compiles* on the advertised minimum compiler, so
    # don't fail it on benign lint differences between 1.88 and stable.
    env:
      RUSTFLAGS: ""
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust 1.88 (declared MSRV)
        uses: dtolnay/rust-toolchain@1.88

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-msrv-${{ hashFiles('**/Cargo.lock') }}

      # Verify the advertised `rust-version = "1.88"` compatibility promise: a
      # change that accidentally uses a newer language/std feature fails here
      # even though it compiles on current stable. 1.88 is the real floor of the
      # dependency tree: edition-2024 crates (zeroize/hashbrown/indexmap/...)
      # need 1.85+, the icu/idna chain needs 1.86, and redis 1.3.0 needs 1.88.
      - name: Check on MSRV (all features)
        run: cargo check --workspace --all-targets --all-features --verbose

  parity:
    name: Parity ledger
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-parity-${{ hashFiles('**/Cargo.lock') }}

      # Rebuilds the Rust public-API index from rustdoc JSON and checks every
      # ledger entry against it, the .NET inventory and the Go catalog
      # (docs/parity/README.md). Fails when a ledger entry names a Rust symbol
      # that no longer exists, so renames and removals cannot silently
      # orphan it, and when docs/parity/STATUS.md is stale.
      - name: Check the parity ledger
        run: cargo xtask parity check
