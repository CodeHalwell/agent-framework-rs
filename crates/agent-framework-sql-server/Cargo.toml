[package]
name = "agent-framework-sql-server"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
keywords.workspace = true
categories.workspace = true
readme.workspace = true
description = "SQL Server vector store for agent-framework (experimental: VECTOR_STORES)"

[dependencies]
agent-framework-core = { workspace = true }
tokio = { workspace = true }
async-trait = { workspace = true }
serde_json = { workspace = true }
uuid = { workspace = true }
# TDS over rustls; no native-tls, no Windows auth.
tiberius = { version = "0.12", default-features = false, features = ["rustls", "tds73"] }
tokio-util = { version = "0.7", features = ["compat"] }
sha2 = "0.10"

[features]
# The whole crate is a vector store, experimental upstream (VECTOR_STORES):
# without this feature it is empty.
experimental-vector-stores = ["agent-framework-core/experimental-vector-stores"]

[dev-dependencies]
tokio = { workspace = true }
