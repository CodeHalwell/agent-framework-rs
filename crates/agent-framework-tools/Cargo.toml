[package]
name = "agent-framework-tools"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
keywords.workspace = true
categories.workspace = true
readme.workspace = true
description = "Built-in tools for agent-framework: a local shell tool with policy, approval gating and persistent sessions, plus a Docker executor"

[dependencies]
agent-framework-core = { workspace = true }
tokio = { workspace = true }
async-trait = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
uuid = { workspace = true }
base64 = { workspace = true }
# Linear-time matching. Policy patterns are written by the operator, but the
# command they are matched against is model-generated; upstream bounds each
# match with a one-second timeout because its engine backtracks. This engine
# cannot backtrack catastrophically, so no timeout is needed.
regex = "1"
shlex = "2"

[target.'cfg(unix)'.dependencies]
# killpg(2) for process-group termination on timeout.
libc = "0.2"

[dev-dependencies]
tokio = { workspace = true }
futures = { workspace = true }
async-trait = { workspace = true }
