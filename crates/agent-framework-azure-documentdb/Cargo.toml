[package]
name = "agent-framework-azure-documentdb"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
keywords.workspace = true
categories.workspace = true
readme.workspace = true
description = "Azure DocumentDB (MongoDB vCore) vector store for agent-framework (experimental: VECTOR_STORES)"

[dependencies]
agent-framework-core = { workspace = true }
# Shares the BSON codec and the driver (re-exported as `mongodb`).
agent-framework-mongodb = { workspace = true }
async-trait = { workspace = true }
futures = { workspace = true }
serde_json = { workspace = true }

[features]
# The whole crate is a vector store, experimental upstream (VECTOR_STORES):
# without this feature it is empty.
experimental-vector-stores = [
    "agent-framework-core/experimental-vector-stores",
    "agent-framework-mongodb/experimental-vector-stores",
]

[dev-dependencies]
tokio = { workspace = true }
