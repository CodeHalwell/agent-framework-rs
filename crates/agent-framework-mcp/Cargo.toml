[package]
name = "agent-framework-mcp"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
keywords.workspace = true
categories.workspace = true
readme.workspace = true
description = "Model Context Protocol (MCP) client: stdio and streamable HTTP transports"

[dependencies]
agent-framework-core = { workspace = true }
tokio = { workspace = true }
futures = { workspace = true }
async-trait = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
reqwest = { workspace = true }
bytes = { workspace = true }
tokio-stream = { workspace = true }
uuid = { workspace = true }
# rustls-tls-webpki-roots matches the workspace's reqwest rustls choice
# (`rustls-tls` = `rustls-tls-webpki-roots`, see root Cargo.toml) — no native-tls.
tokio-tungstenite = { version = "0.29", default-features = false, features = [
    "connect",
    "handshake",
    "rustls-tls-webpki-roots",
] }
# The `skills` feature: `archive` skill entries (in-memory ZIP extraction,
# deflate only, and SHA-256 digest checks).
zip = { version = "9.2", default-features = false, features = ["deflate-flate2"], optional = true }
base64 = { workspace = true, optional = true }
sha2 = { version = "0.10", optional = true }
flate2 = { version = "1", optional = true }

[features]
# FIDES for MCP tools (`security` module): annotation-derived labels and
# server `_meta.ifc` result labels. Experimental upstream (FIDES).
fides = ["agent-framework-core/experimental-fides"]
# Agent Skills served over MCP (SEP-2640, `skills` module).
skills = ["agent-framework-core/file-skills", "dep:zip", "dep:base64", "dep:sha2", "dep:flate2"]

[dev-dependencies]
zip = { version = "9.2", default-features = false, features = ["deflate-flate2"] }
flate2 = "1"
tokio = { workspace = true }
