[package]
name = "agent-framework-foundry-hosting"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
keywords.workspace = true
categories.workspace = true
readme.workspace = true
description = "Host agents and workflows as Azure AI Foundry hosted agents (Responses and Invocations protocols, Foundry state storage)"

[dependencies]
agent-framework-core = { workspace = true }
agent-framework-hosting = { workspace = true }
agent-framework-azure = { workspace = true }
agent-framework-mcp = { workspace = true }
tokio = { workspace = true }
tokio-stream = { workspace = true }
futures = { workspace = true }
async-trait = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
uuid = { workspace = true }
base64 = { workspace = true }
reqwest = { workspace = true }
axum = "0.8"
sha2 = "0.10"

[features]
# `InvocationsHostServer` and the agent-session stores, over core's
# `AgentSessionStore` (experimental upstream: SESSION_STORE).
session-store = ["agent-framework-core/experimental-session-store"]

[dev-dependencies]
tokio = { workspace = true }
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
