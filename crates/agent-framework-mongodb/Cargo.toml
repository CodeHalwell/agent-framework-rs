[package]
name = "agent-framework-mongodb"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
keywords.workspace = true
categories.workspace = true
readme.workspace = true
description = "MongoDB vector store for agent-framework (experimental: VECTOR_STORES)"

[dependencies]
agent-framework-core = { workspace = true }
async-trait = { workspace = true }
futures = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
sha2 = "0.10"
# The official driver; rustls TLS by default.
mongodb = { version = "3", default-features = false, features = ["compat-3-0-0", "rustls-tls", "dns-resolver"] }

[features]
# The whole crate is a vector store, experimental upstream (VECTOR_STORES):
# without this feature it is empty.
experimental-vector-stores = ["agent-framework-core/experimental-vector-stores"]

[dev-dependencies]
tokio = { workspace = true }
