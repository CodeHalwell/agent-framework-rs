[package]
name = "agent-framework-postgres"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
keywords.workspace = true
categories.workspace = true
readme.workspace = true
description = "PostgreSQL + pgvector vector store for agent-framework (experimental: VECTOR_STORES)"

[dependencies]
agent-framework-core = { workspace = true }
tokio = { workspace = true }
tokio-postgres = "0.7"
async-trait = { workspace = true }
serde_json = { workspace = true }
uuid = { workspace = true }
sha2 = "0.10"
tracing = { workspace = true }

[features]
# The whole crate is a vector store, experimental upstream (VECTOR_STORES):
# without this feature it is empty.
experimental-vector-stores = ["agent-framework-core/experimental-vector-stores"]

[dev-dependencies]
tokio = { workspace = true }

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
